name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and policy gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bootstrap the integrity-pinned npm CLI
        run: ./scripts/bootstrap-npm.sh
      - name: Install the locked graph without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run source gates
        run: make ci
      - name: Run repository security gates
        run: make security

  browser:
    name: Chromium shell test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bootstrap the integrity-pinned npm CLI
        run: ./scripts/bootstrap-npm.sh
      - name: Install the locked graph without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the locked Chromium runtime
        run: npm exec --offline -- playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
